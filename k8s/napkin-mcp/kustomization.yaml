apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

metadata:
  name: napkin-mcp

namespace: tas-mcp-servers

resources:
  - deployment.yaml
  - service.yaml
  - configmap.yaml
  - ingress.yaml

# No commonLabels: it also stamped project/tier/service onto the ConfigMap,
# which live does not carry, so each manifest now states its live labels and
# selectors explicitly (MCP-17).
#
# secret.yaml is NOT rendered. napkin-mcp-secret holds live credentials and is
# managed out of band; `kubectl apply` deletes keys a manifest omits, and the
# live last-applied-configuration lists every key, so an empty Secret here
# would wipe them. See secret.yaml for the key names.
