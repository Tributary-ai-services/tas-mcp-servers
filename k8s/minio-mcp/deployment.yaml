apiVersion: apps/v1
kind: Deployment
metadata:
  name: minio-mcp
  namespace: tas-mcp-servers
  labels:
    app: minio-mcp
    component: mcp-server
spec:
  replicas: 1
  selector:
    matchLabels:
      app: minio-mcp
  template:
    metadata:
      labels:
        app: minio-mcp
        component: mcp-server
    spec:
      containers:
      - name: minio-mcp
        image: quay.io/minio/aistor/mcp-server-aistor:latest
        imagePullPolicy: Always
        args:
        - --http
        - --http-port
        - "8090"
        - --allow-write
        - --allow-admin
        - --allowed-directories
        - /tmp/downloads,/tmp/uploads
        ports:
        - containerPort: 8090
          name: http
          protocol: TCP
        envFrom:
        - configMapRef:
            name: minio-mcp-config
        - secretRef:
            name: minio-mcp-secret
        resources:
          requests:
            memory: "256Mi"
            cpu: "100m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        livenessProbe:
          tcpSocket:
            port: 8090
          initialDelaySeconds: 30
          periodSeconds: 30
          timeoutSeconds: 10
          failureThreshold: 3
        readinessProbe:
          tcpSocket:
            port: 8090
          initialDelaySeconds: 15
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
