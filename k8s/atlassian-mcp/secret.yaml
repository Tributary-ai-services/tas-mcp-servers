apiVersion: v1
kind: Secret
metadata:
  name: atlassian-mcp-secret
  namespace: tas-mcp-servers
type: Opaque
stringData:
  # Confluence Cloud credentials
  CONFLUENCE_URL: "REPLACE_WITH_CONFLUENCE_URL"
  CONFLUENCE_USERNAME: "REPLACE_WITH_CONFLUENCE_USERNAME"
  CONFLUENCE_API_TOKEN: "REPLACE_WITH_CONFLUENCE_API_TOKEN"
  # Jira Cloud credentials
  JIRA_URL: "REPLACE_WITH_JIRA_URL"
  JIRA_USERNAME: "REPLACE_WITH_JIRA_USERNAME"
  JIRA_API_TOKEN: "REPLACE_WITH_JIRA_API_TOKEN"
