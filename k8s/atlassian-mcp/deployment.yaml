apiVersion: apps/v1
kind: Deployment
metadata:
  name: atlassian-mcp
  namespace: tas-mcp-servers
  labels:
    app: atlassian-mcp
    component: mcp-server
spec:
  replicas: 1
  selector:
    matchLabels:
      app: atlassian-mcp
  template:
    metadata:
      labels:
        app: atlassian-mcp
        component: mcp-server
    spec:
      containers:
      - name: atlassian-mcp
        image: ghcr.io/sooperset/mcp-atlassian:latest
        imagePullPolicy: Always
        args:
        - --transport
        - streamable-http
        - --port
        - "9000"
        - -vv
        ports:
        - containerPort: 9000
          name: http
          protocol: TCP
        envFrom:
        - secretRef:
            name: atlassian-mcp-secret
        resources:
          requests:
            memory: "256Mi"
            cpu: "100m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        livenessProbe:
          tcpSocket:
            port: 9000
          initialDelaySeconds: 30
          periodSeconds: 30
          failureThreshold: 3
        readinessProbe:
          tcpSocket:
            port: 9000
          initialDelaySeconds: 15
          periodSeconds: 10
          failureThreshold: 3
