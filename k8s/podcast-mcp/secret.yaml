# podcast-mcp-secret — NOT rendered by any kustomization, and holds no data here.
#
# The live Secret (namespace tas-mcp-servers) is created out of band and holds:
#   ELEVENLABS_API_KEY, MINIO_ACCESS_KEY, MINIO_SECRET_KEY,
#   METAVOICE_API_URL, BARK_API_URL, PLAYHT_API_KEY, PLAYHT_USER_ID
# (the last four are empty strings today). The deployment reads them from env.
#
# Do not put values in this file and do not add it back to kustomization.yaml.
# The live object's last-applied-configuration lists five of these keys, so
# applying a Secret without them makes `kubectl apply` DELETE them (SEC-21's
# trap). To change a value:
#   kubectl create secret generic podcast-mcp-secret -n tas-mcp-servers \
#     --from-env-file=<file outside this repo> --dry-run=client -o yaml \
#     | kubectl apply -f -
# then restart the deployment (env is read once at pod start).
#
# Until MCP-17 (2026-11-25) this file committed the live values to this PUBLIC
# repository. They remain in git history and must be treated as exposed.
