apiVersion: apps/v1
kind: Deployment
metadata:
  name: podcast-mcp
  namespace: tas-mcp-servers
  labels:
    app: podcast-mcp
    component: mcp-server
spec:
  replicas: 2
  selector:
    matchLabels:
      app: podcast-mcp
  template:
    metadata:
      labels:
        app: podcast-mcp
        component: mcp-server
    spec:
      # Prefer the compute node (pinova01, labelled tas.io/tier=compute).
      # These are stateless MCP servers with no PVCs; running them off the
      # node that hosts every database frees its memory and page cache.
      #
      # preferred, not required: if the compute node is unavailable they fall
      # back to um773dev rather than sitting Pending.
      affinity:
        nodeAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              preference:
                matchExpressions:
                  - key: tas.io/tier
                    operator: In
                    values: ["compute"]
      containers:
      - name: podcast-mcp
        image: registry-api.tas.scharber.com/podcast-mcp-server:1.0.0
        imagePullPolicy: Always
        ports:
        - containerPort: 8092
          name: http
          protocol: TCP
        envFrom:
        - configMapRef:
            name: podcast-mcp-config
        - secretRef:
            name: podcast-mcp-secret
        # Resources removed — BestEffort QoS until profiled via Prometheus/Grafana
        livenessProbe:
          httpGet:
            path: /health
            port: 8092
          initialDelaySeconds: 30
          periodSeconds: 30
          timeoutSeconds: 10
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /health
            port: 8092
          initialDelaySeconds: 15
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        volumeMounts:
        - name: tmp-dir
          mountPath: /tmp/podcast-mcp
      volumes:
      - name: tmp-dir
        emptyDir:
          sizeLimit: 2Gi
