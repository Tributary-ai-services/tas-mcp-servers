apiVersion: apps/v1
kind: Deployment
metadata:
  name: podcast-mcp
  namespace: tas-mcp-servers
  labels:
    app: podcast-mcp
    component: mcp-server
spec:
  replicas: 2
  selector:
    matchLabels:
      app: podcast-mcp
  template:
    metadata:
      labels:
        app: podcast-mcp
        component: mcp-server
    spec:
      containers:
      - name: podcast-mcp
        image: registry-api.tas.scharber.com/podcast-mcp-server:1.0.0
        imagePullPolicy: Always
        ports:
        - containerPort: 8092
          name: http
          protocol: TCP
        envFrom:
        - configMapRef:
            name: podcast-mcp-config
        - secretRef:
            name: podcast-mcp-secret
        # Resources removed — BestEffort QoS until profiled via Prometheus/Grafana
        livenessProbe:
          httpGet:
            path: /health
            port: 8092
          initialDelaySeconds: 30
          periodSeconds: 30
          timeoutSeconds: 10
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /health
            port: 8092
          initialDelaySeconds: 15
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        volumeMounts:
        - name: tmp-dir
          mountPath: /tmp/podcast-mcp
      volumes:
      - name: tmp-dir
        emptyDir:
          sizeLimit: 2Gi
