apiVersion: apps/v1
kind: Deployment
metadata:
  name: kokoro-tts
  namespace: tas-mcp-servers
spec:
  replicas: 1
  # The selector must spell out exactly what the LIVE Deployment selects on,
  # because a selector is immutable and these labels used to be injected by
  # kustomize `commonLabels` (OPS-28). With `labels: includeSelectors: false`
  # kustomize no longer touches selectors, so declaring only `app` here would
  # render a selector that no longer matches the running pods and the apply
  # would be rejected.
  selector:
    matchLabels:
      app: kokoro-tts
      project: tas
      service: kokoro-tts
      tier: mcp-servers
  template:
    metadata:
      labels:
        app: kokoro-tts
        component: tts-engine
    spec:
      # Prefer the compute node (pinova01, labelled tas.io/tier=compute).
      # These are stateless MCP servers with no PVCs; running them off the
      # node that hosts every database frees its memory and page cache.
      #
      # preferred, not required: if the compute node is unavailable they fall
      # back to um773dev rather than sitting Pending.
      affinity:
        nodeAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              preference:
                matchExpressions:
                  - key: tas.io/tier
                    operator: In
                    values: ["compute"]
      containers:
      - name: kokoro-tts
        image: ghcr.io/remsky/kokoro-fastapi-cpu:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8880
          name: http
        envFrom:
        - configMapRef:
            name: kokoro-tts-config
        # Profiled 2026-09-22 (Phase 1 of MEMORY-RIGHTSIZING-PLAN.md).
        #
        # WHY THIS STOPPED BEING BestEffort: this container is the largest
        # single memory consumer in the cluster — measured at 1,014Mi working
        # set — and it was declaring nothing at all. Two consequences, and the
        # second is the one that bites. BestEffort is evicted FIRST under node
        # pressure, so the biggest process on the node was also the most
        # disposable. And because it reserved nothing, the scheduler believed
        # pinova01 had a gigabyte more free than it did, and would happily
        # place work there that cannot actually fit.
        #
        # Sizing follows CLAUDE.md's formula: requests ~= observed p95,
        # limits ~= 2x. Most of this is loaded model weights, so the working
        # set is flat rather than request-driven — 1Gi is a ceiling it sits
        # at, not an average it wanders around.
        #
        # CAVEAT, deliberately recorded: this is a 6-hour window, not the 7d
        # the policy asks for — cAdvisor only began being scraped on
        # 2026-09-22 (Phase 0). It is sound for "not zero", which is what this
        # change fixes; it is not a finely tuned ceiling. RE-PROFILE AFTER
        # 2026-09-29, when a real 7d p95 exists:
        #   quantile_over_time(0.95, container_memory_working_set_bytes{
        #     namespace="tas-mcp-servers",pod=~"kokoro-tts.*",
        #     container="kokoro-tts"}[7d])
        resources:
          requests:
            memory: "1Gi"
          limits:
            memory: "2Gi"
        # Probes match the running Deployment exactly (OPS-27). They had drifted
        # to httpGet for BOTH probes, which made this manifest unappliable:
        # strategic merge ADDS the httpGet handler to the live tcpSocket rather
        # than replacing it, and a probe with two handlers is rejected by the
        # API ("may not specify more than 1 handler type").
        #
        # The split is deliberate and worth keeping. Liveness is tcpSocket: it
        # only asks whether the process is listening. An httpGet liveness would
        # hit /v1/audio/voices, which can be slow or blocked while the model
        # loads or while a synthesis request is in flight — and a failed
        # liveness probe kills the container, so a busy TTS engine would restart
        # itself. Readiness is the httpGet, because that is the question worth
        # asking before sending traffic: does the API actually answer? Its
        # timeouts are generous (30s, 10 failures) for the same model-load
        # reason.
        livenessProbe:
          tcpSocket:
            port: 8880
          initialDelaySeconds: 120
          periodSeconds: 30
          timeoutSeconds: 5
          failureThreshold: 5
          successThreshold: 1
        readinessProbe:
          httpGet:
            path: /v1/audio/voices
            port: 8880
            scheme: HTTP
          initialDelaySeconds: 60
          periodSeconds: 30
          timeoutSeconds: 30
          failureThreshold: 10
          successThreshold: 1
        volumeMounts:
        - name: model-cache
          mountPath: /root/.cache
      volumes:
      - name: model-cache
        emptyDir:
          sizeLimit: 2Gi
