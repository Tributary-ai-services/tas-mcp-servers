apiVersion: apps/v1
kind: Deployment
metadata:
  name: sequential-thinking-mcp
  namespace: tas-mcp-servers
  labels:
    app: sequential-thinking-mcp
    component: mcp-server
spec:
  replicas: 1
  selector:
    matchLabels:
      app: sequential-thinking-mcp
      project: tas
      service: sequential-thinking-mcp
      tier: mcp-servers
  strategy:
    type: RollingUpdate
  template:
    metadata:
      labels:
        app: sequential-thinking-mcp
        component: mcp-server
        project: tas
        service: sequential-thinking-mcp
        tier: mcp-servers
    spec:
      containers:
      - name: sequential-thinking-mcp
        image: registry-api.tas.scharber.com/tas-mcp-bridge:1.1.0
        imagePullPolicy: Always
        ports:
        - containerPort: 8000
          name: http
          protocol: TCP
        env:
        - name: MCP_COMMAND
          value: npx
        - name: MCP_ARGS
          value: '["-y", "@modelcontextprotocol/server-sequential-thinking"]'
        - name: BRIDGE_PORT
          value: "8000"
        - name: BRIDGE_NAME
          value: sequential-thinking-mcp
        - name: BRIDGE_VERSION
          value: "1.1.0"
        resources: {}
        livenessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 60
          periodSeconds: 30
        readinessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 45
          periodSeconds: 10
