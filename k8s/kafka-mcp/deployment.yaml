apiVersion: apps/v1
kind: Deployment
metadata:
  name: kafka-mcp
  namespace: tas-mcp-servers
  labels:
    app: kafka-mcp
    component: mcp-server
spec:
  replicas: 1
  selector:
    matchLabels:
      app: kafka-mcp
  template:
    metadata:
      labels:
        app: kafka-mcp
        component: mcp-server
    spec:
      containers:
      # Native Kafka MCP server with Streamable HTTP transport
      - name: kafka-mcp-native
        image: ghcr.io/tuannvm/kafka-mcp-server:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 8080
          name: native-http
          protocol: TCP
        envFrom:
        - configMapRef:
            name: kafka-mcp-config
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "256Mi"
            cpu: "500m"
        livenessProbe:
          tcpSocket:
            port: 8080
          initialDelaySeconds: 15
          periodSeconds: 30
          timeoutSeconds: 10
          failureThreshold: 3
        readinessProbe:
          tcpSocket:
            port: 8080
          initialDelaySeconds: 10
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
      # Bridge wraps native Streamable HTTP with /mcp/tools/list and /mcp/tools/call
      - name: kafka-mcp-bridge
        image: registry-api.tas.scharber.com/tas-mcp-bridge:1.0.0
        imagePullPolicy: Always
        env:
        - name: MCP_COMMAND
          value: "npx"
        - name: MCP_ARGS
          value: "-y mcp-remote http://localhost:8080/mcp"
        - name: BRIDGE_PORT
          value: "8000"
        - name: BRIDGE_NAME
          value: "kafka-mcp"
        - name: BRIDGE_VERSION
          value: "1.0.0"
        ports:
        - containerPort: 8000
          name: http
          protocol: TCP
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "256Mi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 60
          periodSeconds: 30
          timeoutSeconds: 10
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 45
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
