apiVersion: apps/v1
kind: Deployment
metadata:
  name: kafka-mcp
  namespace: tas-mcp-servers
  labels:
    app: kafka-mcp
    component: mcp-server
spec:
  replicas: 1
  selector:
    matchLabels:
      app: kafka-mcp
  template:
    metadata:
      labels:
        app: kafka-mcp
        component: mcp-server
    spec:
      containers:
      - name: kafka-mcp
        image: ghcr.io/tuannvm/kafka-mcp-server:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 8080
          name: http
          protocol: TCP
        envFrom:
        - configMapRef:
            name: kafka-mcp-config
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "256Mi"
            cpu: "500m"
        livenessProbe:
          tcpSocket:
            port: 8080
          initialDelaySeconds: 15
          periodSeconds: 30
          timeoutSeconds: 10
          failureThreshold: 3
        readinessProbe:
          tcpSocket:
            port: 8080
          initialDelaySeconds: 10
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
