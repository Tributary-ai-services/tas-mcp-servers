apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

metadata:
  name: dbhub

namespace: tas-mcp-servers

# No deployment.yaml and no configmap.yaml: the dbhub-operator generates both
# from the DBHubInstance below and owns them via ownerReferences. The copies
# that used to sit here could never have worked, and were dangerous in three
# different ways:
#
#   Deployment  — rendered selector {app, project, service, tier} against a
#                 live {app.kubernetes.io/name, .../instance}. A Deployment
#                 selector is immutable, so `apply` was rejected outright:
#                 "spec.selector: Invalid value ...: field is immutable".
#   Service     — same label mismatch, but a Service selector IS mutable, so
#                 the apply would have SUCCEEDED and repointed the Service at
#                 nothing. Fixed in service.yaml.
#   ConfigMap   — declared source id `tas_postgres` where the operator renders
#                 `tas-postgres`, so applying it would have broken every
#                 execute_sql(source=...) call and then been reverted on the
#                 next reconcile. dbhub crash-looped for 227 days on a bad
#                 [[sources]] array once already (MCP-7).
resources:
  - dbhubinstance.yaml
  - service.yaml
  - ingress.yaml

# Secret 'dbhub-secrets' must be created externally with DSN environment variables.
# These are referenced in configmap.yaml's dbhub.toml as ${VAR_NAME}
#
# Example - create secret with database DSNs:
#
# kubectl create secret generic dbhub-secrets \
#   --namespace=tas-mcp-servers \
#   --from-literal=TAS_POSTGRES_DSN="postgres://tasuser:taspassword@tas-postgres-shared.tas-shared.svc.cluster.local:5432/tas_shared?sslmode=disable" \
#   --from-literal=TAS_MYSQL_DSN="mysql://user:pass@mysql-host:3306/db" \
#   --from-literal=ANALYTICS_DSN="postgres://readonly:pass@analytics:5432/warehouse"
#
# Then update configmap.yaml to add corresponding [[sources]] entries.
#
# Users select database by source ID when calling MCP tools:
#   execute_sql(source="tas_postgres", query="SELECT ...")

# `labels:` with includeSelectors:false, NOT commonLabels (OPS-28) — this is
# what made the Service hazard above possible: commonLabels injects these into
# spec.selector, so the Service's selector was being computed rather than
# declared. Values are kept exactly as they are on the live objects rather
# than aligned to the parent's `tier: mcp-servers`; that mismatch is real but
# changing it here would be an unrelated relabel. See OPS-30.
labels:
  - includeSelectors: false
    pairs:
      project: tas
      tier: shared-infrastructure
      service: dbhub
