apiVersion: v1
kind: Secret
metadata:
  name: grafana-mcp-secret
  namespace: tas-mcp-servers
  labels:
    app: grafana-mcp
    component: mcp-server
type: Opaque
stringData:
  # Create a Grafana service account token:
  # Grafana UI → Administration → Service accounts → Add service account
  # Then create a token and paste it here
  GRAFANA_SERVICE_ACCOUNT_TOKEN: "REPLACE_WITH_GRAFANA_SERVICE_ACCOUNT_TOKEN"
