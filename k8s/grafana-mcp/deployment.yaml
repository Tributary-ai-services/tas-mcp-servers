apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana-mcp
  namespace: tas-mcp-servers
  labels:
    app: grafana-mcp
    component: mcp-server
spec:
  replicas: 1
  selector:
    matchLabels:
      app: grafana-mcp
  template:
    metadata:
      labels:
        app: grafana-mcp
        component: mcp-server
    spec:
      containers:
      - name: grafana-mcp
        image: grafana/mcp-grafana:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 8000
          name: http
          protocol: TCP
        envFrom:
        - configMapRef:
            name: grafana-mcp-config
        - secretRef:
            name: grafana-mcp-secret
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "256Mi"
            cpu: "500m"
        livenessProbe:
          tcpSocket:
            port: 8000
          initialDelaySeconds: 30
          periodSeconds: 30
          timeoutSeconds: 10
          failureThreshold: 3
        readinessProbe:
          tcpSocket:
            port: 8000
          initialDelaySeconds: 15
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
