apiVersion: apps/v1
kind: Deployment
metadata:
  name: napkin-operator
  namespace: tas-mcp-servers
  labels:
    app: napkin-operator
    component: operator
spec:
  replicas: 1
  selector:
    matchLabels:
      app: napkin-operator
  template:
    metadata:
      labels:
        app: napkin-operator
        component: operator
    spec:
      serviceAccountName: napkin-operator
      # Prefer the compute node (pinova01, labelled tas.io/tier=compute).
      # Stateless, no PVC; running it off the node that hosts every database
      # frees that node's memory and page cache.
      #
      # preferred, not required: falls back to um773dev if the compute node
      # is unavailable rather than sitting Pending.
      affinity:
        nodeAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              preference:
                matchExpressions:
                  - key: tas.io/tier
                    operator: In
                    values: ["compute"]
      containers:
      - name: napkin-operator
        image: registry-api.tas.scharber.com/napkin-operator:1.0.0
        imagePullPolicy: Always
        args:
        - --metrics-bind-address=:8088
        - --health-probe-bind-address=:8089
        - --leader-elect=false
        ports:
        - containerPort: 8088
          name: metrics
          protocol: TCP
        - containerPort: 8089
          name: health
          protocol: TCP
        envFrom:
        - configMapRef:
            name: napkin-operator-config
        # Resources removed — BestEffort QoS until profiled via Prometheus/Grafana
        livenessProbe:
          httpGet:
            path: /healthz
            port: 8089
          initialDelaySeconds: 15
          periodSeconds: 20
          timeoutSeconds: 5
        readinessProbe:
          httpGet:
            path: /readyz
            port: 8089
          initialDelaySeconds: 5
          periodSeconds: 10
          timeoutSeconds: 5
