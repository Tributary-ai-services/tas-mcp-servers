# postgres-mcp-secret — NOT rendered by any kustomization (MCP-17), and holds
# no data here. The live Secret holds one key, DATABASE_URL.
#
# DATABASE_URL is set out of band and is NOT stored here. Since 2026-11-22
# (Plan #22 C.4) its login is `postgres_mcp_ro`, not the shared `tasuser`: it
# does not rotate with that password, and must never be set back to it. The
# bundled server runs caller SQL as one string after BEGIN READ ONLY, so the
# caller can end that transaction; the role is the only real limit.
#
#   CREATE ROLE postgres_mcp_ro LOGIN NOSUPERUSER NOCREATEDB NOCREATEROLE
#     NOINHERIT NOREPLICATION NOBYPASSRLS CONNECTION LIMIT 20 PASSWORD '...';
#   ALTER ROLE postgres_mcp_ro SET default_transaction_read_only = on;
#   ALTER ROLE postgres_mcp_ro SET statement_timeout = '15s';
#   ALTER ROLE postgres_mcp_ro SET temp_file_limit = '256MB';
#
# It has no table grants, on purpose: any pod can call this Service directly.
# Password: aether-secrets/apps/tas-mcp/postgres-mcp-readonly.env
#
# This file is comment-only so that no apply path in the repo can reach the
# live Secret at all (OPS-47).
