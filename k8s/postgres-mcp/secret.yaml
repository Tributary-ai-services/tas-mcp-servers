apiVersion: v1
kind: Secret
metadata:
  name: postgres-mcp-secret
  namespace: tas-mcp-servers
  labels:
    app: postgres-mcp
    component: mcp-server
    service: postgres-mcp
type: Opaque
# SEC-21: DATABASE_URL (the full DSN, including the rotated shared-PostgreSQL
# password) is set out of band and is NOT stored here. See
# aether-secrets/Shared-Postgres-Password for the value and the full list of
# Secrets that must rotate together.
#
# Applying this file does not clear the live key: its last-applied-configuration
# records no data keys, so the 3-way merge preserves DATABASE_URL.
stringData: {}
