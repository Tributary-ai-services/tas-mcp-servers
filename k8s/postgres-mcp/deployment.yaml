apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres-mcp
  namespace: tas-mcp-servers
  labels:
    app: postgres-mcp
    component: mcp-server
    service: postgres-mcp
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgres-mcp
      service: postgres-mcp
  template:
    metadata:
      labels:
        app: postgres-mcp
        component: mcp-server
        service: postgres-mcp
    spec:
      # Prefer the compute node (pinova01, labelled tas.io/tier=compute).
      # These are stateless MCP servers with no PVCs; running them off the
      # node that hosts every database frees its memory and page cache.
      #
      # preferred, not required: if the compute node is unavailable they fall
      # back to um773dev rather than sitting Pending.
      affinity:
        nodeAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              preference:
                matchExpressions:
                  - key: tas.io/tier
                    operator: In
                    values: ["compute"]
      containers:
        - name: postgres-mcp
          image: registry-api.tas.scharber.com/tas-mcp-bridge:1.2.0@sha256:c32160deca2231cfb2f267248e122fde49826340929f168877680954b76ae580
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
          env:
            - name: MCP_COMMAND
              value: "sh -c"
            - name: MCP_ARGS
              value: '["npx -y @modelcontextprotocol/server-postgres $DATABASE_URL"]'
            - name: MCP_SERVER_TYPE
              value: "postgres"
            - name: BRIDGE_PORT
              value: "8000"
            - name: BRIDGE_NAME
              value: "postgres-mcp"
            - name: BRIDGE_VERSION
              value: "1.1.0"
            # MCP-19: check every _connection's host:port, and the addresses it
            # resolves to, before a child dials it; dial the checked address
            # (DNS rebinding). Read by the first bridge image with
            # src/egress.js; the 1.2.0 image above ignores both. The value must
            # equal MCP_DSN_EGRESS_ALLOW on the tas-mcp proxy and
            # aiqg-dashboard-be. Opens the shared PostgreSQL only: Redis,
            # Keycloak, Kafka and MinIO in tas-shared stay refused. No
            # MCP_TENANT_EGRESS_ALLOWLIST (no external hosts), as on the proxy.
            - name: BRIDGE_DSN_EGRESS
              value: "enforce"
            - name: MCP_DSN_EGRESS_ALLOW
              value: "postgres-shared.tas-shared.svc.cluster.local:5432"
          envFrom:
            - configMapRef:
                name: postgres-mcp-config
            - secretRef:
                name: postgres-mcp-secret
          # Resources removed — BestEffort QoS until profiled via Prometheus/Grafana
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 90
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 60
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
