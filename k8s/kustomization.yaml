apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

metadata:
  name: tas-mcp-servers

resources:
  - namespace.yaml
  - assembler-mcp
  - context7-mcp
  - crawl4ai
  - dbhub
  - grafana-mcp
  - kafka-mcp
  - kokoro-tts
  - minio-mcp
  - napkin-mcp
  - napkin-operator
  - napkin-federation-init.yaml
  - neo4j-mcp
  - paper-search-mcp
  - podcast-mcp
  - sequential-thinking-mcp

# `labels:` with includeSelectors:false, NOT commonLabels (OPS-28).
# commonLabels injects these into the immutable `spec.selector`, so
# `kubectl apply -k` was rejected outright and this manifest could not
# restore the workloads it describes.
labels:
  - includeSelectors: false
    # but DO put them on the pod template: the selector (pinned to the live
    # value in each deployment.yaml) requires them, and a template's labels
    # must be a superset of the selector or the API rejects the Deployment.
    includeTemplates: true
    pairs:
      project: tas
      tier: mcp-servers
