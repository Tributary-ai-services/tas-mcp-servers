apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

metadata:
  name: tas-mcp-servers

# This tree describes production exactly (MCP-17): `kubectl diff -k k8s` exits
# 0 against the live namespace. Keep it that way — diff before you apply.
#
# No repo-wide `labels:` transformer. It used to stamp project/tier onto every
# object, but production is not uniform: assembler-mcp has neither label (and
# adding them to its pod template would roll the pod), the dbhub Ingress is
# `tier: shared-infrastructure`, and several ConfigMaps/CRs carry none. Each
# manifest now states its live labels itself.
#
# Secrets holding live data are NOT rendered by this tree (napkin-mcp,
# podcast-mcp, postgres-mcp, and every out-of-band Secret). `kubectl apply`
# deletes any key a manifest omits, so an empty Secret here would wipe live
# credentials. Each `secret.yaml` is comment-only and says how the Secret is
# created.
#
# napkin-federation-init.yaml was removed: the Job no longer exists, and
# re-creating it would POST a stale `napkin-mcp-server-v1.0.0` registration.
# Federation is managed by the FederatedMCPServer CRs and
# operators/federated-mcp-operator.
resources:
  - namespace.yaml
  - assembler-mcp
  - context7-mcp
  - crawl4ai
  - dbhub
  - grafana-mcp
  - kafka-mcp
  - kokoro-tts
  - minio-mcp
  - napkin-mcp
  - napkin-operator
  - neo4j-mcp
  - paper-search-mcp
  - podcast-mcp
  - postgres-mcp
  - sequential-thinking-mcp
