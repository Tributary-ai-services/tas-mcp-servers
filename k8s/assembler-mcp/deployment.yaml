apiVersion: apps/v1
kind: Deployment
metadata:
  name: assembler-mcp
  namespace: tas-mcp-servers
  labels:
    app: assembler-mcp
spec:
  replicas: 1
  selector:
    matchLabels:
      app: assembler-mcp
  strategy:
    type: RollingUpdate
  template:
    metadata:
      labels:
        app: assembler-mcp
    spec:
      # Prefer the compute node (pinova01, labelled tas.io/tier=compute).
      # These are stateless MCP servers with no PVCs; running them off the
      # node that hosts every database frees its memory and page cache.
      #
      # preferred, not required: if the compute node is unavailable they fall
      # back to um773dev rather than sitting Pending.
      affinity:
        nodeAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              preference:
                matchExpressions:
                  - key: tas.io/tier
                    operator: In
                    values: ["compute"]
      containers:
      - name: assembler-mcp
        image: registry-api.tas.scharber.com/assembler-mcp:1.0.0
        imagePullPolicy: Always
        ports:
        - containerPort: 8091
          name: http
          protocol: TCP
        env:
        - name: PORT
          value: "8091"
        - name: TEMPLATES_DIR
          value: /app/templates
        envFrom:
        - configMapRef:
            name: assembler-mcp-config
        - secretRef:
            name: assembler-mcp-secret
            optional: true
        resources: {}
        livenessProbe:
          httpGet:
            path: /health
            port: http
          initialDelaySeconds: 5
          periodSeconds: 30
        readinessProbe:
          httpGet:
            path: /health
            port: http
          initialDelaySeconds: 3
          periodSeconds: 10
