apiVersion: apps/v1
kind: Deployment
metadata:
  name: crawl4ai
  namespace: tas-mcp-servers
  labels:
    app: crawl4ai
    component: web-scraper
spec:
  replicas: 1
  # The selector must spell out exactly what the LIVE Deployment selects on,
  # because a selector is immutable and these labels used to be injected by
  # kustomize `commonLabels` (OPS-28). With `labels: includeSelectors: false`
  # kustomize no longer touches selectors, so declaring only `app` here would
  # render a selector that no longer matches the running pods and the apply
  # would be rejected.
  selector:
    matchLabels:
      app: crawl4ai
      project: tas
      service: crawl4ai
      tier: mcp-servers
  template:
    metadata:
      labels:
        app: crawl4ai
        component: web-scraper
    spec:
      # Prefer the compute node (pinova01, labelled tas.io/tier=compute).
      # These are stateless MCP servers with no PVCs; running them off the
      # node that hosts every database frees its memory and page cache.
      #
      # preferred, not required: if the compute node is unavailable they fall
      # back to um773dev rather than sitting Pending.
      affinity:
        nodeAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              preference:
                matchExpressions:
                  - key: tas.io/tier
                    operator: In
                    values: ["compute"]
      # The Service is named crawl4ai, so service links would inject
      # CRAWL4AI_PORT=tcp://<ip>:11235 -- and the image's entrypoint reads
      # CRAWL4AI_PORT as its own listen port, so gunicorn died with
      # "'tcp' is not a valid port number" (9,000+ restarts, 2026-09/10).
      enableServiceLinks: false
      containers:
      - name: crawl4ai
        # Pinned (was :latest). 0.9.x's entrypoint changed behaviour under a
        # floating tag; see the CRAWL4AI_API_TOKEN note below.
        image: unclecode/crawl4ai:0.9.5
        ports:
        - containerPort: 11235
          name: http
          protocol: TCP
        envFrom:
        - configMapRef:
            name: crawl4ai-config
        env:
        # Without a token the 0.9.x entrypoint binds 127.0.0.1 only, so the
        # Service, the Ingress and the probes can never reach it. The Secret
        # is created out of band (never committed):
        #   kubectl create secret generic crawl4ai-api-token -n tas-mcp-servers \
        #     --from-literal=token="$(openssl rand -hex 32)"
        - name: CRAWL4AI_API_TOKEN
          valueFrom:
            secretKeyRef:
              name: crawl4ai-api-token
              key: token
        # Resources removed — BestEffort QoS until profiled via Prometheus/Grafana
        volumeMounts:
        - name: shm
          mountPath: /dev/shm
        livenessProbe:
          httpGet:
            path: /health
            port: 11235
          initialDelaySeconds: 60
          periodSeconds: 30
          timeoutSeconds: 10
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /health
            port: 11235
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
      volumes:
      # Shared memory volume for headless browser (Chromium/Playwright)
      # Required minimum 3GB for stable browser operation
      - name: shm
        emptyDir:
          medium: Memory
          sizeLimit: 3Gi
