apiVersion: apps/v1
kind: Deployment
metadata:
  name: firecrawl-mcp
  namespace: tas-mcp-servers
  labels:
    app: firecrawl-mcp
    component: mcp-server
spec:
  replicas: 1
  selector:
    matchLabels:
      app: firecrawl-mcp
  template:
    metadata:
      labels:
        app: firecrawl-mcp
        component: mcp-server
    spec:
      containers:
      - name: firecrawl-mcp
        image: mcp/firecrawl:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 3000
          name: http
          protocol: TCP
        envFrom:
        - configMapRef:
            name: firecrawl-mcp-config
        - secretRef:
            name: firecrawl-mcp-secret
        resources:
          requests:
            memory: "256Mi"
            cpu: "100m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        livenessProbe:
          tcpSocket:
            port: 3000
          initialDelaySeconds: 30
          periodSeconds: 30
          failureThreshold: 3
        readinessProbe:
          tcpSocket:
            port: 3000
          initialDelaySeconds: 15
          periodSeconds: 10
          failureThreshold: 3
