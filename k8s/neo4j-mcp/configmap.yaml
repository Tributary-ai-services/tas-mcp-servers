apiVersion: v1
kind: ConfigMap
metadata:
  name: neo4j-mcp-config
  namespace: tas-mcp-servers
  labels:
    app: neo4j-mcp
    component: mcp-server
data:
  NEO4J_DATABASE: neo4j
  # Plain bolt:// — Bolt TLS is terminated at the NGINX ingress and DISABLED on
  # the in-cluster Neo4j pod, so bolt+ssc:// fails the handshake from here.
  NEO4J_URI: bolt://neo4j.aether-be.svc.cluster.local:7687
