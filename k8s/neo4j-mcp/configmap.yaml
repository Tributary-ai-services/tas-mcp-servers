apiVersion: v1
kind: ConfigMap
metadata:
  name: neo4j-mcp-config
  namespace: tas-mcp-servers
  labels:
    app: neo4j-mcp
    component: mcp-server
data:
  NEO4J_URI: "bolt://neo4j-shared.tas-shared.svc.cluster.local:7687"
  NEO4J_DATABASE: "neo4j"
  NEO4J_TRANSPORT: "http"
  NEO4J_MCP_SERVER_HOST: "0.0.0.0"
  NEO4J_MCP_SERVER_PORT: "8000"
  NEO4J_MCP_SERVER_PATH: "/api/mcp/"
