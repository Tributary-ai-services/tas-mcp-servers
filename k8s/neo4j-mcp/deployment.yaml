apiVersion: apps/v1
kind: Deployment
metadata:
  name: neo4j-mcp
  namespace: tas-mcp-servers
  labels:
    app: neo4j-mcp
    component: mcp-server
spec:
  replicas: 1
  selector:
    matchLabels:
      app: neo4j-mcp
  template:
    metadata:
      labels:
        app: neo4j-mcp
        component: mcp-server
    spec:
      containers:
      - name: neo4j-mcp
        image: mcp/neo4j-cypher:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 8000
          name: http
          protocol: TCP
        envFrom:
        - configMapRef:
            name: neo4j-mcp-config
        - secretRef:
            name: neo4j-mcp-secret
        resources:
          requests:
            memory: "256Mi"
            cpu: "100m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /api/mcp/
            port: 8000
          initialDelaySeconds: 30
          periodSeconds: 30
          timeoutSeconds: 10
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /api/mcp/
            port: 8000
          initialDelaySeconds: 15
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
