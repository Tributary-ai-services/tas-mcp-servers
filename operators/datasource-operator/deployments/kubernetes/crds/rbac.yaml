apiVersion: v1
kind: ServiceAccount
metadata:
  name: datasource-operator
  namespace: tas-mcp-servers
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: datasource-operator
rules:
  - apiGroups:
      - datasource.tas.ai
    resources:
      - datasourceconnections
    verbs:
      - get
      - list
      - watch
      - create
      - update
      - patch
      - delete
  - apiGroups:
      - datasource.tas.ai
    resources:
      - datasourceconnections/status
    verbs:
      - get
      - update
      - patch
  - apiGroups:
      - datasource.tas.ai
    resources:
      - datasourceconnections/finalizers
    verbs:
      - update
  - apiGroups:
      - ""
    resources:
      - secrets
    verbs:
      - get
      - list
      - watch
  - apiGroups:
      - ""
    resources:
      - events
    verbs:
      - create
      - patch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: datasource-operator
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: datasource-operator
subjects:
  - kind: ServiceAccount
    name: datasource-operator
    namespace: tas-mcp-servers
