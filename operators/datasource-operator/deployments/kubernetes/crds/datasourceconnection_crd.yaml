apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: datasourceconnections.datasource.tas.ai
spec:
  group: datasource.tas.ai
  names:
    kind: DatasourceConnection
    listKind: DatasourceConnectionList
    plural: datasourceconnections
    singular: datasourceconnection
    shortNames:
      - dsc
    categories:
      - datasource
      - tas
  scope: Namespaced
  versions:
    - name: v1
      served: true
      storage: true
      subresources:
        status: {}
      additionalPrinterColumns:
        - name: Type
          type: string
          jsonPath: .spec.type
        - name: Host
          type: string
          jsonPath: .spec.host
        - name: Phase
          type: string
          jsonPath: .status.phase
        - name: Latency
          type: integer
          jsonPath: .status.latencyMs
        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp
      schema:
        openAPIV3Schema:
          type: object
          properties:
            apiVersion:
              type: string
            kind:
              type: string
            metadata:
              type: object
            spec:
              type: object
              required:
                - type
                - host
                - port
                - credentialsSecretRef
              properties:
                type:
                  type: string
                  enum:
                    - neo4j
                    - postgres
                    - minio
                    - kafka
                    - grafana
                host:
                  type: string
                port:
                  type: integer
                database:
                  type: string
                protocol:
                  type: string
                sslMode:
                  type: string
                credentialsSecretRef:
                  type: object
                  required:
                    - name
                  properties:
                    name:
                      type: string
                    usernameKey:
                      type: string
                      default: username
                    passwordKey:
                      type: string
                      default: password
                tenantId:
                  type: string
                spaceId:
                  type: string
                ownerUserId:
                  type: string
                bridgeEndpoint:
                  type: string
                healthCheckInterval:
                  type: integer
                  default: 300
            status:
              type: object
              properties:
                phase:
                  type: string
                  enum:
                    - Pending
                    - Testing
                    - Connected
                    - Failed
                lastTestedAt:
                  type: string
                  format: date-time
                lastTestResult:
                  type: string
                latencyMs:
                  type: integer
                  format: int64
                message:
                  type: string
                observedGeneration:
                  type: integer
                  format: int64
