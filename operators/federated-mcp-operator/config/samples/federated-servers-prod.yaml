  category: observability
  endpoint: "http://grafana-mcp.tas-mcp-servers.svc.cluster.local:8000"
  protocol: http
  auth: { type: none }
  capabilities: [search_dashboards, get_dashboard_by_uid, get_dashboard_summary, get_dashboard_property, get_dashboard_panel_queries, update_dashboard, list_datasources, get_datasource_by_uid, get_datasource_by_name, query_prometheus, list_prometheus_metric_names, list_prometheus_label_names, list_prometheus_label_values, list_prometheus_metric_metadata, list_loki_label_names, list_loki_label_values, query_loki_logs, query_loki_stats, find_error_pattern_logs, list_incidents, get_incident, create_incident, add_activity_to_incident, list_alert_rules, get_alert_rule_by_uid, list_contact_points, list_oncall_schedules, list_oncall_teams, list_oncall_users, get_current_oncall_users, get_oncall_shift, list_teams, list_users_by_org, list_sift_investigations, get_sift_investigation, get_sift_analysis, find_slow_requests, list_pyroscope_label_names, list_pyroscope_label_values, list_pyroscope_profile_types, fetch_pyroscope_profile, generate_deeplink, get_assertions]
