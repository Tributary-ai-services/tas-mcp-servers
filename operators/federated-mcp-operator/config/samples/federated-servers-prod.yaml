# FederatedMCPServer CRs for the MCP servers federated into prod-tas-mcp.
#
# Status (validated end-to-end through the gateway on 2026-07-16, real tool
# lists returned): 12 servers working. Tool counts in comments.
#
# EXCLUDED (registered, invoke-tested, removed — reasons):
#   * kokoro-tts  — not an MCP server (OpenAI-style TTS API: /v1/models 200, /mcp/* 404).
# dbhub uses the MCP Streamable-HTTP transport → protocol: sse (added in tas-mcp #24).
# neo4j-mcp works after the bridge initialize-handshake fix (tas-mcp-bridge:1.1.0).
#
# Only add servers you want the GATEWAY to front (reduce-at-source + compliance
# scanning on their tool results). REDUCTION_ENABLED is currently off on prod, so
# this federates/routes them; reduce-at-source activates when it's enabled.
#
# Apply:  kubectl apply -f federated-servers-prod.yaml
---
apiVersion: mcp.tas.ai/v1
kind: FederatedMCPServer
metadata:
  name: napkin-mcp
  namespace: tas-mcp-servers
spec:
  displayName: "Napkin AI Visual Generation"  # 7 tools
  category: visualization
  endpoint: "http://napkin-mcp.tas-mcp-servers.svc.cluster.local:8087"
  protocol: http
  auth: { type: none }
  reduce: true
  capabilities: [generate_visual]
---
apiVersion: mcp.tas.ai/v1
kind: FederatedMCPServer
metadata:
