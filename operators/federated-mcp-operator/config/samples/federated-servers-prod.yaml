  capabilities: [ask_object, copy_object, create_bucket, download_object, get_admin_info, get_bucket_lifecycle, get_bucket_replication, get_bucket_tags, get_bucket_versioning, get_data_usage_info, get_object_metadata, get_object_presigned_url, get_object_tags, get_object_versions, list_allowed_directories, list_bucket_contents, list_buckets, list_local_files, set_bucket_tags, set_bucket_versioning, set_object_tags, text_to_object, upload_object]
---
apiVersion: mcp.tas.ai/v1
kind: FederatedMCPServer
metadata:
