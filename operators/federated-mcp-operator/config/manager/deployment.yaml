apiVersion: apps/v1
kind: Deployment
metadata:
  name: federated-mcp-operator
  namespace: tas-mcp-servers
  labels:
    app: federated-mcp-operator
spec:
  replicas: 1
  selector:
    matchLabels:
      app: federated-mcp-operator
  template:
    metadata:
      labels:
        app: federated-mcp-operator
    spec:
      serviceAccountName: federated-mcp-operator
      # Prefer the compute node (pinova01, labelled tas.io/tier=compute).
      # Stateless, no PVC; running it off the node that hosts every database
      # frees that node's memory and page cache.
      #
      # preferred, not required: falls back to um773dev if the compute node
      # is unavailable rather than sitting Pending.
      affinity:
        nodeAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              preference:
                matchExpressions:
                  - key: tas.io/tier
                    operator: In
                    values: ["compute"]
      containers:
        - name: operator
          image: registry-api.tas.scharber.com/federated-mcp-operator:0.4.0@sha256:88e5e544f1b9e4e00871974c82709d541e9542467a4c8fc0ebcb4017e2ca1017
          args:
            - --leader-elect
            - --gateway-url=http://prod-tas-mcp-http.tas-mcp-prod.svc.cluster.local:8082
          env:
            - name: TAS_MCP_GATEWAY_URL
              value: "http://prod-tas-mcp-http.tas-mcp-prod.svc.cluster.local:8082"
            # tas-mcp's MCP_ADMIN_TOKEN (Plan #22 C.1/C.2), sent as
            # TAS-MCP-Admin-Token. Required once the gateway runs with
            # MCP_TENANT_SERVERS=true; optional so this Deployment still
            # starts while the Secret does not exist (today's deploy).
            - name: MCP_ADMIN_TOKEN
              valueFrom:
                secretKeyRef:
                  name: tas-mcp-admin-token
                  key: token
                  optional: true
          ports:
            - name: metrics
              containerPort: 8088
            - name: health
              containerPort: 8089
          # Resources omitted — BestEffort QoS until profiled (TAS K8s policy)
          livenessProbe:
            httpGet:
              path: /healthz
              port: health
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /readyz
              port: health
            initialDelaySeconds: 5
            periodSeconds: 10
