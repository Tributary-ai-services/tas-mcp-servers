apiVersion: v1
kind: ServiceAccount
metadata:
  name: federated-mcp-operator
  namespace: tas-mcp-servers
---
# Binds the controller-gen-generated role.yaml (ClusterRole
# federated-mcp-operator-role) to the operator's ServiceAccount.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: federated-mcp-operator-rolebinding
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: federated-mcp-operator-role
subjects:
  - kind: ServiceAccount
    name: federated-mcp-operator
    namespace: tas-mcp-servers
