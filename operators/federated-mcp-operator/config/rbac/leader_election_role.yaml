# Permissions the controller-runtime manager needs for leader election and event
# recording. Namespaced Role (the lease lives in the operator's own namespace).
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: federated-mcp-operator-leader-election
  namespace: tas-mcp-servers
rules:
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["create", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: federated-mcp-operator-leader-election
  namespace: tas-mcp-servers
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: federated-mcp-operator-leader-election
subjects:
  - kind: ServiceAccount
    name: federated-mcp-operator
    namespace: tas-mcp-servers
