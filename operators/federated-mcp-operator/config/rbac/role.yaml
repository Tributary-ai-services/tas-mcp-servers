---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: federated-mcp-operator-role
rules:
- apiGroups:
  - ""
  resources:
  - secrets
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - mcp.tas.ai
  resources:
  - federatedmcpservers
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - mcp.tas.ai
  resources:
  - federatedmcpservers/finalizers
  verbs:
  - update
- apiGroups:
  - mcp.tas.ai
  resources:
  - federatedmcpservers/status
  verbs:
  - get
  - patch
  - update
