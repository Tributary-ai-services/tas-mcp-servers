version: "3.8"

services:
  podcast-mcp:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: podcast-mcp
    ports:
      - "8092:8092"
    environment:
      - HEALTH_PORT=8092
      - MINIO_ENDPOINT=http://tas-minio-shared:9000
      - MINIO_PUBLIC_URL=${MINIO_PUBLIC_URL:-http://localhost:9000}
      - MINIO_ACCESS_KEY=${MINIO_ACCESS_KEY:-minioadmin}
      - MINIO_SECRET_KEY=${MINIO_SECRET_KEY:-minioadmin123}
      - MINIO_ASSETS_BUCKET=podcast-assets
      - MINIO_OUTPUT_BUCKET=podcast-output
      - KOKORO_API_URL=${KOKORO_API_URL:-http://kokoro-tts:8880}
      - ELEVENLABS_API_KEY=${ELEVENLABS_API_KEY:-}
      - METAVOICE_API_URL=${METAVOICE_API_URL:-}
      - BARK_API_URL=${BARK_API_URL:-}
      - TTS_CONCURRENCY=3
    networks:
      - tas-shared-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8092/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

networks:
  tas-shared-network:
    external: true
